name: Sync tool metadata

on:
  push:
    branches:
      - main
    paths:
      - "tools/**/catalog.json"
      - "tools/**/sitemap.xml"
      - "scripts/sync-tool-metadata.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tool-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate root catalog and sitemap
        run: node scripts/sync-tool-metadata.cjs

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- catalog.json sitemap.xml; then
            echo "Root metadata is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json sitemap.xml
          git commit -m "chore: sync tool catalog and sitemap"
          git push

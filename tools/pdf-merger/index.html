<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .file-item:hover .remove-btn {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-12 h-12 bg-red-500/20 rounded-xl flex items-center justify-center text-red-400 text-2xl">
                <i class="fa-solid fa-file-pdf"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">PDF Merger</h1>
                <p class="text-slate-400">Combine multiple PDFs into one document. Processing happens entirely in your browser.</p>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6 mb-6">
            <div id="dropzone" class="border-2 border-dashed border-slate-700 rounded-xl p-10 text-center transition-colors cursor-pointer hover:border-blue-500 hover:bg-blue-500/5">
                <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-500 mb-4"></i>
                <p class="text-lg font-medium text-slate-300">Click or drag & drop PDF files here</p>
                <p class="text-sm text-slate-500 mt-2">Merge up to 20 files at once</p>
            </div>
        </div>

        <div id="fileListContainer" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-white">Selected Files</h2>
                <button id="clearAll" class="text-sm text-slate-400 hover:text-red-400 transition-colors">Clear All</button>
            </div>
            <div id="fileList" class="space-y-2 mb-6">
                <!-- Files will be listed here -->
            </div>

            <div class="flex justify-end gap-4">
                <button id="mergeBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-3 rounded-xl transition-all flex items-center gap-2">
                    <i class="fa-solid fa-layer-group"></i>
                    Merge PDFs
                </button>
            </div>
        </div>

        <div id="loader" class="hidden flex flex-col items-center justify-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-4"></div>
            <p class="text-slate-400">Merging your files... This may take a moment.</p>
        </div>

        <footer class="mt-12 text-center text-slate-500 text-sm border-t border-slate-800 pt-8">
            <p><i class="fa-solid fa-shield-halved mr-2"></i>Privacy First: Your files never leave your computer.</p>
        </footer>
    </div>

    <script src="./tool.js"></script>
</body>
</html>

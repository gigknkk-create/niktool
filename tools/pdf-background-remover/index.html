<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Background Remover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #preview-canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold mb-4 flex items-center justify-center gap-3">
                    <i class="fas fa-file-pdf text-red-500"></i>
                    PDF Background Remover
                </h1>
                <p class="text-slate-400">Convert PDF pages to images with transparent backgrounds or clean white space.</p>
            </div>

            <div class="glass-panel rounded-2xl p-8 mb-8">
                <div id="drop-zone" class="border-2 border-dashed border-slate-700 rounded-xl p-12 text-center hover:border-blue-500 transition-colors cursor-pointer">
                    <input type="file" id="pdf-upload" class="hidden" accept="application/pdf">
                    <i class="fas fa-cloud-upload-alt text-5xl text-slate-500 mb-4"></i>
                    <p class="text-xl mb-2">Drop your PDF here</p>
                    <p class="text-sm text-slate-500 uppercase tracking-widest">or click to browse</p>
                </div>

                <div id="controls" class="hidden mt-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-slate-300">Removal Sensitivity (Threshold)</label>
                            <input type="range" id="threshold" min="0" max="255" value="240" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            <div class="flex justify-between text-xs text-slate-500">
                                <span>Strict (Keep Gray)</span>
                                <span>Loose (Aggressive)</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-slate-300">Output Format</label>
                            <select id="output-type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="pdf">New PDF (Cleaned)</option>
                                <option value="png">PNG Images (Transparent)</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-4 items-center justify-center pt-4">
                        <button id="process-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-xl transition-all flex items-center gap-2">
                            <i class="fas fa-magic"></i> Process PDF
                        </button>
                        <button id="reset-btn" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-8 rounded-xl transition-all">
                            Reset
                        </button>
                    </div>
                </div>
            </div>

            <div id="status-container" class="hidden glass-panel rounded-2xl p-6 mb-8 text-center">
                <div id="loader" class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
                <p id="status-text" class="text-slate-300 font-medium">Processing page 1 of ...</p>
            </div>

            <div id="preview-section" class="hidden glass-panel rounded-2xl p-8">
                <h3 class="text-xl font-semibold mb-4 text-center">Last Page Preview</h3>
                <div class="flex justify-center bg-slate-800 rounded-lg p-4 overflow-hidden">
                    <canvas id="preview-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script src="./tool.js"></script>
</body>
</html>
